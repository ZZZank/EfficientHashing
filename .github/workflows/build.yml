name: build
on:
  pull_request:
  push:
  workflow_dispatch:
    inputs:
      release_type:
        type: choice
        options:
          - none
          - debug
          - release
          - beta
          - alpha
        default: none


jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v7

      - name: setup Gradle wrapper
        uses: gradle/actions/setup-gradle@v6

      - name: setup Java 25
        uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: 'zulu'

      - name: make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: build
        run: ./gradlew buildAndCollect

      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: build/libs/

      - name: publish
        if: ${{ inputs.release_type && inputs.release_type != 'none' }}
        run: ./gradlew publishMod -Ppublish.release_type=${{ inputs.release_type }} --no-configuration-cache
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSE_TOKEN: ${{ secrets.CURSE_TOKEN }}
          # GITHUB_TOKEN is generated automatically, so it will publish whenever 'publish.github' is defined